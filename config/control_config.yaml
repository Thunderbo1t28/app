# Конфигурация управления системой
system:
  auto_start: true
  trading_hours:
    start: "10:00"
    end: "18:50"
  max_positions: 10
  risk_management:
    max_position_size: 100000
    max_drawdown: 0.02
    stop_loss: 0.01

instruments:
  - symbol: "SBER"
    type: "stock"
    exchange: "MOEX"
    enabled: true
  - symbol: "GAZP"
    type: "stock"
    exchange: "MOEX"
    enabled: true

strategies:
  - name: "momentum"
    timeframe: "1h"
    parameters:
      lookback: 20
      threshold: 0.02
  - name: "mean_reversion"
    timeframe: "4h"
    parameters:
      lookback: 30
      std_dev: 2.0 